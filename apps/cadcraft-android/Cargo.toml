[package]
name = "cadcraft-android"
description = "Android port of CADCraft with hardware GPU acceleration (Vulkan / OpenGL ES) and storage permissions for import/export"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "cadcraft_android"
crate-type = ["cdylib", "rlib"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

[dependencies]
cadcraft-doc.workspace = true
cadcraft-color.workspace = true
cadcraft-geom.workspace = true
cadcraft-render.workspace = true
cadcraft-dxf.workspace = true
cadcraft-dwg.workspace = true
cadcraft-io.workspace = true
cadcraft-engine.workspace = true
cadcraft-ui-egui.workspace = true

eframe = { workspace = true, features = ["default_fonts", "wgpu", "persistence"] }
egui.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, default-features = false, features = ["default_fonts", "wgpu", "persistence", "android-native-activity"] }
android-activity = { version = "=0.6.1", features = ["native-activity"] }
jni = "=0.22.4"
ndk = "=0.9.0"
